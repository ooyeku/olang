[package]
name = "otc"
version = "0.1.0"
edition = "2021"
authors = ["Ola Yeku <oyeku@gmail.com>"]
description = "Olang Toolchain - Command-line tools for the Olang language"
license = "MIT"
repository = "https://github.com/ooyeku/olang"

[dependencies]
olang = { path = ".." }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
miette = { version = "5.10", features = ["fancy"] }
num_cpus = "1.16" 