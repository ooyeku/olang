[package]
name = "otc"
version = "0.77.0"
edition = "2024"
authors = ["Olang Team"]
description = "olang toolchain — scaffolding, package management, and code analysis"
license = "MIT"
repository = "https://github.com/ooyeku/olang"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
libc = "0.2"
olang = { path = ".." }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["blocking", "json"] }
sha2 = "0.10"
