[package]
name = "olang-ods"
version = "0.77.0"
edition = "2024"
description = "ods — the numerical engine behind olang's data stack. Pure kernels, no olang dependency."
license = "MIT"
repository = "https://github.com/ooyeku/olang"

[features]
default = ["parallel", "stats"]
# Rayon data parallelism. Off for wasm builds; every parallel kernel has a
# sequential twin selected by the caller-provided `par` flag, so disabling
# the feature only changes speed, never results.
parallel = ["dep:rayon"]
# Distributions (statrs) and inference kernels: t-tests, chi2, OLS.
stats = ["dep:statrs"]

[dependencies]
rayon = { version = "1.12", optional = true }
statrs = { version = "0.19", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
serde_json = "1"

[[bench]]
name = "series"
harness = false

[[bench]]
name = "ols"
harness = false

[[bench]]
name = "groupby"
harness = false

[[bench]]
name = "crossover"
harness = false

[[bench]]
name = "expr"
harness = false

[[bench]]
name = "dtypes"
harness = false

[[bench]]
name = "stats"
harness = false
