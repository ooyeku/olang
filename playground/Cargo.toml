# The wasm playground artifact: olang without its native feature, packaged
# as a cdylib so `cargo build -p olang-playground --target
# wasm32-unknown-unknown --release` emits the .wasm the website loads.
# Kept as its own crate so native builds of olang never pay for a cdylib.
[package]
name = "olang-playground"
version = "0.79.0"
edition = "2024"
description = "olang compiled to WebAssembly for the browser playground"
license = "MIT"
repository = "https://github.com/ooyeku/olang"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
olang = { path = "..", default-features = false }
