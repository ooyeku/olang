# The wasm playground artifact: olang without its native feature, packaged
# as a cdylib so `cargo build -p olang-playground --target
# wasm32-unknown-unknown --release` emits the browser runtime (docs/wasm.md).
# Kept as its own crate so native builds of olang never pay for a cdylib.
[package]
name = "olang-playground"
version = "1.0.0-rc.3"
edition = "2024"
description = "olang compiled to WebAssembly for the browser playground"
license = "MIT"
repository = "https://github.com/ooyeku/olang"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# `full`: the whole stdlib, the `re` module and RSA included, for a
# playground that runs any program. The
# default is the browser profile the web SDK and the examples ship.
default = []
full = ["olang/regex-module", "olang/rsa-crypto"]

[dependencies]
olang = { path = "..", default-features = false }
