<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tracker — olang frontend</title>
<style>
  /* ── the olang tracker design system ─────────────────────────────── */
  :root {
    --bg: #0b0f14;
    --panel: #101720;
    --panel-2: #131c27;
    --line: #1d2937;
    --line-soft: #17202c;
    --text: #d9e6ef;
    --dim: #7f93a3;
    --faint: #55697a;
    --mint: #3ddc97;
    --mint-soft: rgba(61, 220, 151, 0.12);
    --amber: #f4b84c;
    --amber-soft: rgba(244, 184, 76, 0.12);
    --red: #ef6b73;
    --red-soft: rgba(239, 107, 115, 0.12);
    --blue: #5aa9e6;
    --blue-soft: rgba(90, 169, 230, 0.12);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --radius: 8px;
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(61, 220, 151, 0.06), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 14px/1.5 var(--sans);
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select { font: inherit; color: var(--text); }

  /* ── header ──────────────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(11, 15, 20, 0.85);
    position: sticky; top: 0; z-index: 30;
    backdrop-filter: blur(10px);
  }
  .brand { display: flex; align-items: baseline; gap: 8px; font-family: var(--mono); }
  .brand .mark { color: var(--mint); font-weight: 700; }
  .brand .name { font-weight: 600; letter-spacing: 0.02em; }
  .brand .sub { color: var(--faint); font-size: 11px; }
  #search {
    flex: 1; max-width: 360px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 14px; outline: none;
    transition: border-color 0.15s;
  }
  #search:focus { border-color: var(--mint); }
  #search::placeholder { color: var(--faint); }
  .pills { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .pills button {
    padding: 4px 12px; border-radius: 999px; color: var(--dim);
    font-size: 12.5px; transition: all 0.15s;
  }
  .pills button:hover { color: var(--text); }
  .pills button.active { background: var(--mint-soft); color: var(--mint); }
  .spacer { flex: 1; }
  .header-link {
    color: var(--dim); font-size: 12.5px; text-decoration: none;
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
    transition: all 0.15s;
  }
  .header-link:hover { color: var(--mint); border-color: var(--mint); }
  .wasm-note { font-family: var(--mono); font-size: 11px; color: var(--faint); }

  /* ── stats strip ─────────────────────────────────────────────────── */
  #stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px; padding: 18px 22px 4px;
    max-width: 1180px; margin: 0 auto;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--line-soft);
    border-radius: var(--radius); padding: 12px 14px;
  }
  .stat .n { font-family: var(--mono); font-size: 22px; font-weight: 600; }
  .stat .l { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
  .stat.mint .n { color: var(--mint); }
  .stat.amber .n { color: var(--amber); }
  .stat.blue .n { color: var(--blue); }

  /* ── activity ────────────────────────────────────────────────────── */
  #activity-wrap { max-width: 1180px; margin: 10px auto 0; padding: 0 22px; }
  #activity {
    display: flex; gap: 18px; overflow-x: auto;
    font-family: var(--mono); font-size: 11.5px; color: var(--dim);
    padding: 6px 2px 10px; white-space: nowrap;
  }
  #activity .ev b { color: var(--text); font-weight: 500; }
  #activity .ev .k { color: var(--mint); }

  /* ── main layout ─────────────────────────────────────────────────── */
  main {
    max-width: 1180px; margin: 8px auto 40px; padding: 0 22px;
    display: flex; gap: 16px; align-items: flex-start;
  }
  .table-wrap {
    flex: 1; min-width: 0;
    background: var(--panel); border: 1px solid var(--line-soft);
    border-radius: var(--radius); overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th { padding: 0; border-bottom: 1px solid var(--line); }
  thead button {
    width: 100%; text-align: left;
    padding: 10px 12px;
    color: var(--faint); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    transition: color 0.15s;
  }
  thead button:hover { color: var(--mint); }
  thead th.sorted button { color: var(--mint); }
  tbody td { padding: 8px 12px; border-bottom: 1px solid var(--line-soft); }
  tbody tr { transition: background 0.12s; }
  tbody tr:hover { background: var(--panel-2); }
  tbody tr.selected { background: var(--mint-soft); }
  td.id { font-family: var(--mono); color: var(--faint); width: 46px; }
  td.title-cell { cursor: pointer; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.title-cell:hover { color: var(--mint); }
  tr.status-done td.title-cell { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--line); }
  td.num { text-align: right; width: 64px; }
  td.del { width: 40px; text-align: center; }
  td.del button { color: var(--faint); font-size: 15px; border-radius: 6px; width: 26px; height: 26px; transition: all 0.15s; }
  td.del button:hover { color: var(--red); background: var(--red-soft); }

  .pill {
    font-family: var(--mono); font-size: 11.5px;
    border-radius: 999px; padding: 3px 10px;
    border: 1px solid var(--line); color: var(--dim);
    transition: all 0.15s;
  }
  .pill:hover { border-color: currentColor; }
  .pill.st-open { color: var(--blue); background: var(--blue-soft); border-color: transparent; }
  .pill.st-in-progress { color: var(--amber); background: var(--amber-soft); border-color: transparent; }
  .pill.st-done { color: var(--mint); background: var(--mint-soft); border-color: transparent; }
  .pill.pr-low { color: var(--dim); }
  .pill.pr-medium { color: var(--amber); }
  .pill.pr-high { color: var(--red); background: var(--red-soft); border-color: transparent; }

  input.cell {
    width: 100%; background: transparent; border: 1px solid transparent;
    border-radius: 6px; padding: 4px 6px; outline: none;
    transition: all 0.15s;
  }
  input.cell:hover { border-color: var(--line); }
  input.cell:focus { border-color: var(--mint); background: var(--bg); }
  input.cell.num { text-align: right; font-family: var(--mono); }
  #empty { padding: 40px; text-align: center; color: var(--faint); display: none; }
  #empty.show { display: block; }

  /* ── drawer ──────────────────────────────────────────────────────── */
  #drawer {
    width: 340px; flex-shrink: 0;
    background: var(--panel); border: 1px solid var(--line-soft);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px; position: sticky; top: 74px;
    display: none;
  }
  #drawer.open { display: block; animation: slide 0.18s ease-out; }
  @keyframes slide { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
  #drawer .drawer-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  #drawer .drawer-top .id-tag { font-family: var(--mono); color: var(--faint); font-size: 12px; }
  #drawer-close { color: var(--faint); font-size: 16px; border-radius: 6px; width: 26px; height: 26px; }
  #drawer-close:hover { color: var(--text); background: var(--panel-2); }
  #dtitle {
    width: 100%; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; outline: none; font-size: 15px; font-weight: 600;
  }
  #dtitle:focus { border-color: var(--mint); }
  .dmeta { display: flex; gap: 8px; margin: 10px 0 14px; flex-wrap: wrap; font-size: 12px; color: var(--dim); align-items: center; }
  .dsection { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin: 14px 0 6px; }
  #comments { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
  .comment { background: var(--panel-2); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  .comment .who { font-family: var(--mono); font-size: 11px; color: var(--mint); margin-bottom: 2px; }
  .comment-row { display: flex; gap: 6px; margin-top: 10px; }
  #new-comment {
    flex: 1; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; outline: none;
  }
  #new-comment:focus { border-color: var(--mint); }
  #comment-btn {
    background: var(--mint-soft); color: var(--mint); border-radius: 6px;
    padding: 0 14px; font-weight: 600; transition: all 0.15s;
  }
  #comment-btn:hover { background: var(--mint); color: #06251a; }

  /* ── composer ────────────────────────────────────────────────────── */
  #composer {
    max-width: 1180px; margin: 0 auto 8px; padding: 0 22px;
    display: flex; gap: 8px;
  }
  #composer input, #composer select {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 9px 12px; outline: none;
    transition: border-color 0.15s;
  }
  #composer input:focus, #composer select:focus { border-color: var(--mint); }
  #new-title { flex: 1; }
  #new-title::placeholder { color: var(--faint); }
  #new-assignee { width: 130px; }
  #new-points { width: 70px; text-align: right; font-family: var(--mono); }
  #new-priority { width: 110px; background: var(--panel); }
  #add-btn {
    background: var(--mint); color: #06251a; font-weight: 700;
    border-radius: var(--radius); padding: 0 22px; transition: filter 0.15s;
  }
  #add-btn:hover { filter: brightness(1.1); }

  /* ── footer ──────────────────────────────────────────────────────── */
  footer {
    max-width: 1180px; margin: 0 auto 40px; padding: 6px 22px;
    display: flex; justify-content: space-between; gap: 14px;
    color: var(--faint); font-size: 12px; font-family: var(--mono);
  }
  #summary b { color: var(--dim); font-weight: 500; }
  @media (max-width: 900px) {
    main { flex-direction: column; }
    #drawer { width: 100%; position: static; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">o&gt;</span><span class="name">tracker</span>
    <span class="sub">a full-stack olang app</span>
  </div>
  <input id="search" placeholder="search title or assignee…" autocomplete="off">
  <div class="pills" id="filters">
    <button id="flt-all" class="active">all</button>
    <button id="flt-open">open</button>
    <button id="flt-in-progress">in progress</button>
    <button id="flt-done">done</button>
  </div>
  <div class="spacer"></div>
  <a class="header-link" href="/orbit.html">orbit</a>
  <a class="header-link" href="/notes.html">notes</a>
  <a class="header-link" href="/primes.html">primes</a>
  <a class="header-link" href="/charts.html">charts</a>
  <a class="header-link" href="/gallery.html">gallery</a>
  <a class="header-link" href="/board.html">board</a>
  <a class="header-link" href="/api/export.csv">export csv</a>
  <span class="wasm-note">app.ol → wasm</span>
</header>

<div id="stats"></div>

<div id="activity-wrap"><div id="activity"></div></div>

<div id="composer">
  <input id="new-title" placeholder="What needs doing?  (Enter to add)" autocomplete="off">
  <input id="new-assignee" placeholder="assignee" autocomplete="off">
  <select id="new-priority">
    <option value="low">low</option>
    <option value="medium" selected>medium</option>
    <option value="high">high</option>
  </select>
  <input id="new-points" placeholder="pts" autocomplete="off">
  <button id="add-btn">Add</button>
</div>

<main>
  <div class="table-wrap">
    <table>
      <thead>
        <tr id="sort-row">
          <th><button id="sort-id">#</button></th>
          <th><button id="sort-title">Title</button></th>
          <th><button id="sort-status">Status</button></th>
          <th><button id="sort-priority">Priority</button></th>
          <th><button id="sort-assignee">Assignee</button></th>
          <th><button id="sort-points">Pts</button></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty">nothing matches — clear the search or add an issue</div>
  </div>

  <aside id="drawer">
    <div class="drawer-top">
      <span class="id-tag" id="drawer-id"></span>
      <button id="drawer-close" title="close">×</button>
    </div>
    <input id="dtitle" autocomplete="off">
    <div class="dmeta" id="dmeta"></div>
    <div class="dsection">comments</div>
    <div id="comments"></div>
    <div class="comment-row">
      <input id="new-comment" placeholder="add a comment (Enter)" autocomplete="off">
      <button id="comment-btn">send</button>
    </div>
  </aside>
</main>

<footer>
  <span><span id="count"></span> · <span id="summary"></span></span>
  <span id="backend-note"></span>
</footer>

<!-- client state lives in the DOM, keeping the app itself stateless -->
<input type="hidden" id="st-sort" value="id">
<input type="hidden" id="st-order" value="asc">
<input type="hidden" id="st-status" value="">
<input type="hidden" id="st-sel" value="">

<script src="/olang-dom.js" data-src="/app.ol" data-bin="/app.olb"></script>
</body>
</html>
