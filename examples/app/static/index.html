<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tracker — olang frontend</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#0e1319; --line:#232b35; --paper:#e6edf3; --body:#a9b6c3;
          --teal:#2dd4bf; --surface:#141a22; }
  * { box-sizing:border-box }
  body { margin:0; background:#f6f8fa; color:#1c2733;
         font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
  header { background:var(--ink); color:var(--paper); padding:0.7rem 1.2rem;
           display:flex; align-items:center; gap:0.8rem }
  header .mark { color:var(--teal); font-weight:700; font-family:ui-monospace,monospace }
  header .note { margin-left:auto; font-size:0.8rem; color:var(--body);
                 font-family:ui-monospace,monospace }
  main { max-width:56rem; margin:1.2rem auto; padding:0 1rem }
  table { width:100%; border-collapse:collapse; background:#fff;
          border:1px solid #d7dee6 }
  th { text-align:left; font-size:0.72rem; letter-spacing:0.08em;
       text-transform:uppercase; color:#5d6b7a; padding:0.5rem 0.7rem;
       border-bottom:2px solid #d7dee6 }
  td { padding:0.45rem 0.7rem; border-bottom:1px solid #e4eaf0 }
  td.id { color:#8a97a5; width:2.5rem } td.num { text-align:right }
  tr.status-done td { color:#9aa7b4 } tr.status-done td:nth-child(2)
  { text-decoration:line-through }
  button.status { border:1px solid #cfd8e0; background:#fff; border-radius:3px;
                  padding:0.15rem 0.6rem; cursor:pointer;
                  font-family:ui-monospace,monospace; font-size:0.8rem }
  tr.status-in-progress button.status { color:#0d8f7a; border-color:#0d8f7a }
  tr.status-done button.status { color:#8a97a5 }
  td.del button { border:0; background:none; color:#b04a4a; cursor:pointer;
                  font-size:1rem }
  #newrow { display:flex; gap:0.6rem; margin-top:0.8rem }
  #new-title { flex:1; padding:0.5rem 0.7rem; border:1px solid #cfd8e0;
               border-radius:3px; font-size:0.95rem }
  #add-btn { background:var(--teal); border:0; border-radius:3px;
             padding:0.5rem 1.1rem; font-weight:600; cursor:pointer }
  footer { max-width:56rem; margin:0.8rem auto 2rem; padding:0 1rem;
           display:flex; gap:1.2rem; font-size:0.85rem; color:#5d6b7a }
  footer #backend-note { margin-left:auto; font-family:ui-monospace,monospace }
  a.other { color:#0d8f7a }
</style>
</head>
<body>
<header>
  <span class="mark">o&gt;</span> <strong>tracker</strong>
  <span class="note">frontend logic: app.ol, running as WebAssembly</span>
</header>
<main>
  <table>
    <thead><tr><th>#</th><th>Title</th><th>Status</th><th>Priority</th>
      <th>Assignee</th><th>Pts</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="newrow">
    <input id="new-title" placeholder="New issue — type a title">
    <button id="add-btn">Add</button>
  </div>
</main>
<footer>
  <span id="count"></span><span id="summary"></span>
  <span id="backend-note"></span>
</footer>
<script src="/olang-dom.js"></script>
</body>
</html>
