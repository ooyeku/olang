<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>charts — olang data stack</title>
  <style>
    nav.demos {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: center; align-items: center; gap: 1rem;
      padding: 0.6rem 1rem; font-size: 12px;
      background: rgba(11, 14, 20, 0.88); border-bottom: 1px solid #1e2430;
      backdrop-filter: blur(8px);
    }
    nav.demos a { color: #9aa4b2; text-decoration: none; }
    nav.demos a:hover { color: #7fd1b9; }
    nav.demos a.here { color: #7fd1b9; font-weight: 600; }
    nav.demos .sep { color: #2a3444; }
    nav.demos .src { color: #5b6577; }
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 3.5rem 1.5rem 2rem; min-height: 100vh;
      background: #0b0e14; color: #9aa4b2;
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    header {
      max-width: 1180px; margin: 0 auto 1rem;
      display: flex; align-items: baseline; gap: 1rem;
    }
    h1 { color: #7fd1b9; font-size: 1.05rem; margin: 0; }
    #hud { color: #5b6577; }
    button {
      margin-left: auto; background: #1a2230; color: #7fd1b9;
      border: 1px solid #263042; border-radius: 8px;
      padding: 0.35rem 0.9rem; font: inherit; cursor: pointer;
    }
    #grid {
      max-width: 1180px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1rem;
    }
    #grid > div {
      background: #0e1116; border: 1px solid #1e2430; border-radius: 12px;
      padding: 0.5rem; overflow: hidden;
    }
    p.note { max-width: 1180px; margin: 1rem auto 0; opacity: 0.7; }
  </style>
</head>
<body>
  <nav class="demos">
    <a href="/">tracker</a>
    <a href="/orbit.html">orbit</a>
    <a href="/notes.html">notes</a>
    <a href="/primes.html">primes</a>
    <a class="here" href="/charts.html">charts</a>
    <a href="/gallery.html">gallery</a>
    <span class="sep">|</span>
    <a class="src" href="/charts.ol">view source (charts.ol)</a>
  </nav>
  <header>
    <h1>charts — live tracker analytics</h1>
    <span id="hud">loading…</span>
    <button id="refresh">refresh</button>
  </header>
  <div id="grid">
    <div id="c-status"></div>
    <div id="c-grouped"></div>
    <div id="c-stacked"></div>
    <div id="c-hist"></div>
    <div id="c-box"></div>
    <div id="c-heat"></div>
    <div id="c-area"></div>
  </div>
  <p class="note"><b>the data stack in the browser</b> — one fetch_json, then ods frames and plot SVG, all in olang. Edit issues in the tracker and hit refresh.</p>
  <script src="/olang-dom.js" data-src="/charts.ol" defer></script>
</body>
</html>
