<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>board — olang dashboard</title>
  <style>
    nav.demos {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: center; align-items: center; gap: 1rem;
      padding: 0.6rem 1rem; font-size: 12px;
      background: rgba(11, 14, 20, 0.88); border-bottom: 1px solid #1e2430;
      backdrop-filter: blur(8px);
    }
    nav.demos a { color: #9aa4b2; text-decoration: none; }
    nav.demos a:hover { color: #7fd1b9; }
    nav.demos a.here { color: #7fd1b9; font-weight: 600; }
    nav.demos .sep { color: #2a3444; }
    nav.demos .src { color: #5b6577; }
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 3.5rem 1.5rem 2rem; min-height: 100vh;
      background: #0b0e14; color: #9aa4b2;
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    header {
      max-width: 1180px; margin: 0 auto 1rem;
      display: flex; align-items: baseline; gap: 1rem;
    }
    h1 { color: #7fd1b9; font-size: 1.05rem; margin: 0; }
    header span { color: #5b6577; }
    select {
      margin-left: auto; background: #1a2230; color: #7fd1b9;
      border: 1px solid #263042; border-radius: 8px;
      padding: 0.35rem 0.7rem; font: inherit;
    }
    #board { max-width: 1180px; margin: 0 auto; }
    p.note { max-width: 1180px; margin: 1rem auto 0; opacity: 0.7; }
  </style>
</head>
<body>
  <nav class="demos">
    <a href="/">tracker</a>
    <a href="/orbit.html">orbit</a>
    <a href="/notes.html">notes</a>
    <a href="/primes.html">primes</a>
    <a href="/charts.html">charts</a>
    <a href="/gallery.html">gallery</a>
    <a class="here" href="/board.html">board</a>
    <span class="sep">|</span>
    <a class="src" href="/board.ol">view source (board.ol)</a>
  </nav>
  <header>
    <h1>board — tracker ops</h1>
    <span>auto-refreshes every 5s · filter is the URL</span>
    <select id="b-flt">
      <option value="">all statuses</option>
      <option value="open">open</option>
      <option value="in-progress">in progress</option>
      <option value="done">done</option>
    </select>
  </header>
  <div id="board"></div>
  <p class="note"><b>the dashboard kit</b> — dash builds the shell (KPIs, cards, grid), viz fills it, the URL carries the filter, and the whole page is one olang source file.</p>
  <script src="/olang-dom.js" data-src="/board.ol" defer></script>
</body>
</html>
