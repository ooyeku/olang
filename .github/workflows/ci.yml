# CI, currently manual-only: automatic per-push runs are switched off to
# keep the Actions bill at zero. The full local gate (make prepush, the
# workspace suite, run_all) remains the verification on every change;
# dispatch this workflow by hand when a Linux/Windows build check is
# wanted. The release workflow still fires only on deliberate v* tags.
name: CI

on:
  workflow_dispatch:
    inputs:
      full_tests:
        description: "also run cargo test --workspace on Linux"
        type: boolean
        default: false

# A superseded push's run is wasted spend; cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      # Build links only the shipped products (four binaries/libs). The
      # workspace's ~60 integration-test executables each statically link
      # the whole dependency tree; linking them all under --all-targets
      # is what killed GNU ld with SIGBUS on the 4-core runner. `check
      # --all-targets` still compiles every test's code — full build
      # signal, zero test-binary links.
      - name: Build products
        run: cargo build --workspace
      - name: Check all targets
        run: cargo check --workspace --all-targets

  test:
    name: Test (Linux, on demand)
    if: github.event_name == 'workflow_dispatch' && inputs.full_tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Test
        run: cargo test --workspace
