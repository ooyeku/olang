[package]
name = "olang"
version = "0.39.0"
edition = "2021"
authors = ["Ola Yeku <oyeku@gmail.com>"]
description = "A minimal, expressive language with first-class functions, pipelines, and pattern matching"
license = "MIT"
repository = "https://github.com/ooyeku/olang"
keywords = ["language", "repl", "interpreter", "functional"]
categories = ["development-tools"]

[workspace]
members = [".", "otc", "playground", "olang-ods"]

[features]
default = ["native", "ods"]
# ods — the Olang Data Stack (docs/design/ods.md). Pure Rust, so it is
# not part of the "native" set: the playground can enable it explicitly.
# The engine crate builds without rayon by default; the native feature
# switches its parallel kernels on (wasm builds stay sequential).
ods = ["dep:olang-ods"]
# Everything that cannot exist in a browser: sockets, SQLite's C library,
# terminals, mmap, process/host introspection, thread pools. The playground
# (wasm32) build compiles with --no-default-features; gated code falls back
# to a clear "unavailable in the playground" error.
native = [
    "dep:rusqlite",
    "dep:rustyline",
    "dep:reqwest",
    "dep:tokio",
    "dep:hyper",
    "dep:memmap2",
    "dep:hostname",
    "dep:whoami",
    "dep:dirs",
    "dep:rayon",
    "dep:num_cpus",
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "olang-ods?/parallel",
]

[dependencies]
# The ods numerical engine (docs/design/ods.md): pure kernels, no olang
# dependency. default-features off keeps rayon out of wasm builds; the
# native feature turns its parallel kernels on.
olang-ods = { path = "olang-ods", optional = true, default-features = false, features = ["stats"] }

# Core parsing and AST
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
csv = "1.3"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
toml = "0.8"
semver = { version = "1.0", features = ["serde"] }
base64 = "0.22"
hostname = { version = "0.4", optional = true }
whoami = { version = "1.4", optional = true }
dirs = { version = "5.0", optional = true }

# Cryptographic libraries for stdlib
sha2 = { version = "0.10", features = ["oid"] }
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
bcrypt = "0.15"
hex = "0.4"
aes-gcm = "0.10"
rsa = "0.9"
argon2 = "0.5"

# REPL and CLI
rustyline = { version = "13.0", optional = true }
clap = { version = "4.4", features = ["derive"] }
colored = "2.0"  # Terminal colors for better display

# Error handling and utilities
anyhow = "1.0"
thiserror = "1.0"
miette = { version = "5.10", features = ["fancy"] }

# High-performance filesystem libraries for stdlib
memmap2 = { version = "0.9", optional = true }  # Memory-mapped file I/O for maximum speed

# HTTP libraries for stdlib
reqwest = { version = "0.11", features = ["blocking", "json"], optional = true }  # HTTP client
tokio = { version = "1", features = ["full"], optional = true }  # Async runtime
hyper = { version = "0.14", features = ["full"], optional = true }  # HTTP server
url = "2.5"  # URL parsing
urlencoding = "2.1"  # URL encoding/decoding

# Math and Random libraries for stdlib
rand = { version = "0.8", features = ["std_rng"] }  # Random number generation
rand_distr = "0.4"  # Random distributions (normal, etc.)

# Collections and data structures
im = { version = "15.1", features = ["serde"] }  # Persistent/immutable collections for O(1) environment cloning

# Parallelization
rayon = { version = "1.8", optional = true }  # Data parallelism library
once_cell = "1.19"     # Thread-safe lazy statics
parking_lot = "0.12"   # High-performance synchronization primitives
num_cpus = { version = "1.16", optional = true }  # CPU core detection

# The baseline JIT (src/ovm/jit.rs): pure-integer hot functions compile to
# native code. Native-only — the wasm playground never sees these.
cranelift-codegen = { version = "0.121.0", optional = true }
cranelift-frontend = { version = "0.121.0", optional = true }
cranelift-jit = { version = "0.121.0", optional = true }
cranelift-module = { version = "0.121.0", optional = true }

# Optional: For better debugging and development
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# default-features off: the default set includes "wasmbind" (a wasm-bindgen
# shim for Utc::now on wasm), which would drag wasm-bindgen imports into the
# playground artifact. Wall-clock "now" goes through src/clock.rs instead.
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }

# Playground (wasm) build: the same crate compiled to wasm32-unknown-unknown
# with --no-default-features. The "native" feature carries every dependency
# that cannot exist in a browser (sockets, SQLite's C library, terminals,
# mmap, JIT). getrandom needs its "js" backend on wasm so `random` works.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# "custom" (not "js"): the js backend needs wasm-bindgen, which the manual
# C-ABI boundary avoids. src/playground.rs registers a generator fed by the
# host's crypto.getRandomValues through the host_random_bytes import.
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.3"
tempfile = "3.8"

# Fuzzing and stress testing dependencies
arbitrary = "1.3"         # Generate arbitrary data for fuzzing
fake = "2.9"              # Generate fake data for testing
quickcheck = "1.0"        # Property-based testing
lazy_static = "1.4"       # Static variables for test infrastructure
rand_chacha = "0.3"       # Deterministic random number generation

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true 

[[bench]]
name = "interpreter_bench"
harness = false
