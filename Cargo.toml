[package]
name = "olang"
version = "0.28.0"
edition = "2021"
authors = ["Ola Yeku <oyeku@gmail.com>"]
description = "A minimal, expressive language with first-class functions, pipelines, and pattern matching"
license = "MIT"
repository = "https://github.com/ooyeku/olang"
keywords = ["language", "repl", "interpreter", "functional"]
categories = ["development-tools"]

[workspace]
members = [".", "otc"]

[dependencies]
# Core parsing and AST
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
bincode = "1.3"  # Binary serialization for smart caching
csv = "1.3"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
semver = { version = "1.0", features = ["serde"] }
base64 = "0.22"
hostname = "0.4"
whoami = "1.4"
dirs = "5.0"

# Cryptographic libraries for stdlib
sha2 = { version = "0.10", features = ["oid"] }
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
bcrypt = "0.15"
hex = "0.4"
aes-gcm = "0.10"
rsa = "0.9"
argon2 = "0.5"

# REPL and CLI
rustyline = "13.0"
clap = { version = "4.4", features = ["derive"] }
colored = "2.0"  # Terminal colors for better display

# Error handling and utilities
anyhow = "1.0"
thiserror = "1.0"
miette = { version = "5.10", features = ["fancy"] }

# High-performance filesystem libraries for stdlib
memmap2 = "0.9"  # Memory-mapped file I/O for maximum speed
walkdir = "2.4"  # Fast directory traversal
glob = "0.3"     # Pattern matching for file paths

# HTTP libraries for stdlib
reqwest = { version = "0.11", features = ["blocking", "json"] }  # HTTP client
tokio = { version = "1", features = ["full"] }  # Async runtime
hyper = { version = "0.14", features = ["full"] }  # HTTP server
url = "2.5"  # URL parsing
urlencoding = "2.1"  # URL encoding/decoding

# Math and Random libraries for stdlib
rand = { version = "0.8", features = ["std_rng"] }  # Random number generation
rand_distr = "0.4"  # Random distributions (normal, etc.)

# Collections and data structures
indexmap = "2.0"
dashmap = "5.5"
im = { version = "15.1", features = ["serde"] }  # Persistent/immutable collections for O(1) environment cloning

# Parallelization
rayon = "1.8"          # Data parallelism library
once_cell = "1.19"     # Thread-safe lazy statics  
parking_lot = "0.12"   # High-performance synchronization primitives
num_cpus = "1.16"      # CPU core detection

# Future JIT support (commented out for now)
# cranelift = "0.100"
# cranelift-module = "0.100"
# cranelift-simplejit = "0.100"

# Optional: For better debugging and development
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4.41"
cranelift = "0.121.0"

# For async runtime and unique IDs
# uuid = { version = "1.0", features = ["v4"] }

# OVM (Olang Virtual Machine) dependencies
crossbeam = "0.8"           # Lock-free data structures
crossbeam-queue = "0.3"     # Lock-free queues for OVM
atomic = "0.6"              # Additional atomic operations
memoffset = "0.9"           # Memory offset calculations for GC
cranelift-jit = "0.121.0"   # JIT compilation backend
cranelift-module = "0.121.0" # Module system for Cranelift
cranelift-codegen = "0.121.0" # Code generation
target-lexicon = "0.12"     # Target platform detection

# Phase 4 Sprint 2: SIMD and Vectorization dependencies
wide = "0.7"                # Safe SIMD operations (stable and reliable)
num-traits = "0.2"          # Numeric trait abstractions for vectorization

[dev-dependencies]
criterion = "0.5"
proptest = "1.3"
tempfile = "3.8"

# Fuzzing and stress testing dependencies
arbitrary = "1.3"         # Generate arbitrary data for fuzzing
fake = "2.9"              # Generate fake data for testing
quickcheck = "1.0"        # Property-based testing
lazy_static = "1.4"       # Static variables for test infrastructure
rand_chacha = "0.3"       # Deterministic random number generation

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true 

[[bench]]
name = "interpreter_bench"
harness = false
