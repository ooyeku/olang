[package]
name = "olang"
version = "0.58.0"
edition = "2024"
authors = ["Ola Yeku <ooyeku@gmail.com>"]
description = "olang — the Open Language: open code (meta.parse), open artifacts (inspectable binaries + capabilities), open execution (deterministic record/replay); a batteries-included functional language with a data stack, no-GIL parallelism, and a three-tier runtime"
license = "MIT"
repository = "https://github.com/ooyeku/olang"
keywords = ["language", "repl", "interpreter", "functional"]
categories = ["development-tools"]

[workspace]
members = [".", "otc", "playground", "olang-ods"]

[features]
default = ["native"]
# Everything that cannot exist in a browser: sockets, SQLite's C library,
# terminals, mmap, process/host introspection, thread pools. The playground
# (wasm32) build compiles with --no-default-features; gated code falls back
# to a clear "unavailable in the playground" error.
native = [
    "dep:rusqlite",
    "dep:rustyline",
    "dep:reqwest",
    "dep:hostname",
    "dep:whoami",
    "dep:dirs",
    "dep:rayon",
    "dep:num_cpus",
    "dep:lsp-server",
    "dep:lsp-types",
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:ctrlc",
    "olang-ods/parallel",
]

[dependencies]
# The ods numerical engine (docs/design/ods.md): pure kernels, no olang
# dependency. default-features off keeps rayon out of wasm builds; the
# native feature turns its parallel kernels on.
olang-ods = { path = "olang-ods", default-features = false, features = ["stats"] }

# Core parsing and AST
pest = "2.8"
pest_derive = "2.8"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
csv = "1.4"
regex = "1.13"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
toml = "0.8"
semver = { version = "1.0", features = ["serde"] }
base64 = "0.23"
hostname = { version = "0.4", optional = true }
whoami = { version = "1.4", optional = true }
dirs = { version = "5.0", optional = true }

# Cryptographic libraries for stdlib
sha2 = { version = "0.10", features = ["oid"] }
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
bcrypt = "0.19"
hex = "0.4"
aes-gcm = "0.10"
rsa = "0.9"
argon2 = "0.5"

# REPL and CLI
rustyline = { version = "18.0", optional = true }
clap = { version = "4.6", features = ["derive"] }
colored = "2.0"  # Terminal colors for better display

# Error handling and utilities
anyhow = "1.0"
thiserror = "2.0"
miette = { version = "7.6", features = ["fancy"] }

# HTTP libraries for stdlib. reqwest (hyper 1 under the hood) is the whole
# client stack — it brings its own async runtime for the blocking API, so
# no direct tokio/hyper dependency is needed. `http.serve` is hand-rolled
# TCP in src/stdlib/http.rs and uses none of this.
reqwest = { version = "0.13", features = ["blocking", "json"], optional = true }  # HTTP client
url = "2.5"  # URL parsing
urlencoding = "2.1"  # URL encoding/decoding

# Math and Random libraries for stdlib. NOTE: StdRng's seeded stream is
# not stable across rand majors — a rand upgrade changes what
# random.seed(n) reproduces (documented in the CHANGELOG when it happens).
rand = "0.10"  # Random number generation (std/std_rng/thread_rng defaults)
rand_distr = "0.6"  # Random distributions (normal, etc.)

# Collections and data structures
im = { version = "15.1", features = ["serde"] }  # Persistent/immutable collections for O(1) environment cloning

# Parallelization
rayon = { version = "1.12", optional = true }  # Data parallelism library
parking_lot = "0.12"   # High-performance synchronization primitives
num_cpus = { version = "1.16", optional = true }  # CPU core detection

# The language server (src/tools/lsp.rs): `olang lsp` speaks LSP over
# stdio to editors. Native-only.
lsp-server = { version = "0.7", optional = true }
lsp-types = { version = "0.95", optional = true }

# The baseline JIT (src/ovm/jit.rs): pure-integer hot functions compile to
# native code. Native-only — the wasm playground never sees these.
cranelift-codegen = { version = "0.134.3", optional = true }
cranelift-frontend = { version = "0.134.3", optional = true }
cranelift-jit = { version = "0.134.3", optional = true }
cranelift-module = { version = "0.134.3", optional = true }

# SIGINT (Ctrl-C) handling for `os.on_interrupt` — cross-platform, sets a
# flag a long-running loop polls for graceful shutdown. Native-only: the
# playground has no signals.
ctrlc = { version = "3.4", optional = true }

# Optional: For better debugging and development
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# default-features off: the default set includes "wasmbind" (a wasm-bindgen
# shim for Utc::now on wasm), which would drag wasm-bindgen imports into the
# playground artifact. Wall-clock "now" goes through src/clock.rs instead.
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }

# Playground (wasm) build: the same crate compiled to wasm32-unknown-unknown
# with --no-default-features. The "native" feature carries every dependency
# that cannot exist in a browser (sockets, SQLite's C library, terminals,
# mmap, JIT). Entropy comes from the host's crypto.getRandomValues through
# the host_random_bytes import (no wasm-bindgen; the manual C-ABI boundary
# stays import-free apart from clocks and entropy). Two getrandom majors
# coexist in the wasm graph and each needs its own custom-backend hookup,
# both defined in src/playground.rs:
#
# - getrandom 0.4 (rand 0.10, bcrypt): selected by building with
#   --cfg getrandom_backend="custom" (.cargo/config.toml sets this for the
#   wasm32 target); src/playground.rs defines __getrandom_v03_custom.
# - getrandom 0.2 (rand_core 0.6 era: rsa, aes-gcm, argon2): the "custom"
#   feature plus register_custom_getrandom!.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = "0.4"
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.3"
tempfile = "3.8"
rand_chacha = "0.10"      # Deterministic random number generation

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true 

[[bench]]
name = "interpreter_bench"
harness = false
