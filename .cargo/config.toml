# The interpreter recurses on the host stack by design (main.rs runs eval
# on a 256 MB thread for its documented 1000-frame call-depth limit).
# Debug-build eval frames are large and grow with unrelated enum/derive
# changes, so test threads need more than the 2 MB Rust default — 16 MB
# keeps recursion-heavy tests (and every future FieldTypeCheck variant)
# off the cliff. Release builds are unaffected either way.
[env]
RUST_MIN_STACK = "16777216"

# Wasm playground builds select getrandom 0.4's opt-in "custom" backend:
# src/playground.rs defines the __getrandom_v03_custom hook, fed by the
# page's crypto.getRandomValues through the host_random_bytes import.
# (getrandom 0.2, still in the graph via the rand_core 0.6 era crypto
# crates, uses its cargo-feature-based custom registration instead —
# see the wasm32 dependency block in Cargo.toml.)
#
# The wasm ships without its symbol names: the `name` section was 612 KB
# of a 6.7 MB artifact, useful to nothing but a wasm-level profiler. To
# read a stack in browser devtools with names, build once without the
# strip flag.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="custom"', '-C', 'strip=symbols']
